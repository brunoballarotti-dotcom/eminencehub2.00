<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eminence Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Eminence Hub</h1>

    <p class="frase-shadow">
        Oculto nas sombras, acima de todos.
    </p>

    <p>Pesquise e cadastre seus animes favoritos.</p>

    <h2>Pesquisar Anime</h2>

    <input type="text" id="anime" placeholder="Digite o nome de um anime">

    <button id="botao">
        Pesquisar
    </button>

    <p id="resultado"></p>

    <h2>Cadastro de Anime</h2>

    <p>Nome do Anime</p>
    <input type="text" id="nomeAnime">

    <p>Quantidade de Episódios</p>
    <input type="number" id="episodiosCadastro">

    <br><br>

    <button id="cadastrar">
        Cadastrar
    </button>

    <p id="mensagem"></p>

    <h3>Arquivo da Shadow Garden</h3>

    <div id="listaAnimes"></div>

    <script src="script.js"></script>

</body>
</html>
